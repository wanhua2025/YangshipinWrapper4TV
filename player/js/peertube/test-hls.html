<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeerTube Player - 完整功能测试</title>
  <link rel="stylesheet" href="./peertube-player.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
      background: #1a1a2e;
      color: #eee;
    }
    h1 { color: #e94560; margin-bottom: 5px; }
    .subtitle { color: #888; margin-bottom: 20px; font-size: 14px; }
    .player-container {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 30px rgba(233,69,96,0.3);
    }
    .controls-row {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    input[type="text"] {
      flex: 1;
      min-width: 300px;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #16213e;
      color: #eee;
      font-size: 14px;
    }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      background: #e94560;
      color: white;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover { background: #d63850; }
    button.secondary { background: #0f3460; }
    button.secondary:hover { background: #1a4a7a; }
    button.active { background: #27ae60; }

    .feature-panels {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .panel {
      background: #16213e;
      border-radius: 10px;
      padding: 18px;
      border: 1px solid #0f3460;
    }
    .panel h3 {
      margin-top: 0;
      color: #4fc3f7;
      font-size: 16px;
      border-bottom: 1px solid #0f3460;
      padding-bottom: 8px;
    }
    .panel-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .panel-row button {
      padding: 6px 12px;
      font-size: 12px;
      flex: 1;
      min-width: 80px;
    }
    .panel label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 5px;
    }
    .panel select, .panel input[type="number"] {
      width: 100%;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #0f3460;
      color: #eee;
      font-size: 13px;
    }

    .log-panel {
      margin-top: 20px;
      padding: 15px;
      background: #0f3460;
      border-radius: 10px;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
    }
    .log-panel h3 { margin-top: 0; color: #e94560; }
    .log-entry { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .log-info { color: #4fc3f7; }
    .log-error { color: #ff5252; }
    .log-success { color: #66bb6a; }
    .log-warn { color: #ffa726; }

    .status-bar {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 10px;
      padding: 10px 15px;
      background: #0f3460;
      border-radius: 8px;
      font-size: 13px;
    }
    .status-item { display: flex; align-items: center; gap: 6px; }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
    }
    .status-dot.playing { background: #66bb6a; animation: pulse 1.5s infinite; }
    .status-dot.paused { background: #ffa726; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <h1>🎬 PeerTube Player - 完整功能测试</h1>
  <div class="subtitle">HLS 点播 / P2P 带宽分担 / 倍速 / 画中画 / 字幕 / 章节 / 快捷键 / 统计面板</div>

  <div class="controls-row">
    <input type="text" id="m3u8Url" value="https://v.cdnlz22.com/20251201/26662_ac323b1a/index.m3u8" placeholder="M3U8 地址 (支持 /proxy/ 前缀绕过 CORS)">
    <button onclick="loadVideo()">加载视频</button>
  </div>

  <div class="status-bar">
    <div class="status-item">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">未播放</span>
    </div>
    <div class="status-item">
      <span>⏱️ <span id="currentTime">00:00</span> / <span id="duration">00:00</span></span>
    </div>
    <div class="status-item">
      <span>📊 缓冲: <span id="buffered">0s</span></span>
    </div>
    <div class="status-item">
      <span>⚡ 速度: <span id="playbackRate">1x</span></span>
    </div>
    <div class="status-item">
      <span>🔊 音量: <span id="volume">100%</span></span>
    </div>
    <div class="status-item">
      <span>🌐 P2P: <span id="p2pStatus">--</span></span>
    </div>
  </div>

  <div class="player-container" style="margin-top: 15px;">
    <video id="my-video" playsinline></video>
  </div>

  <div class="feature-panels">
    <div class="panel">
      <h3>🎮 播放控制</h3>
      <div class="panel-row">
        <button class="secondary" onclick="togglePlay()">⏯️ 播放/暂停</button>
        <button class="secondary" onclick="seekBy(-10)">⏪ -10s</button>
        <button class="secondary" onclick="seekBy(10)">⏩ +10s</button>
      </div>
      <div class="panel-row">
        <button class="secondary" onclick="seekTo(0)">🏠 开头</button>
        <button class="secondary" onclick="muteToggle()">🔇 静音</button>
        <button class="secondary" onclick="toggleFullscreen()">⛶ 全屏</button>
      </div>
      <div class="panel-row">
        <button class="secondary" onclick="togglePiP()">🖼️ 画中画</button>
        <button class="secondary" onclick="toggleLoop()">🔁 循环</button>
        <button class="secondary" onclick="showStats()">📈 统计</button>
      </div>
    </div>

    <div class="panel">
      <h3>⚡ 倍速播放</h3>
      <div class="panel-row">
        <button class="secondary" onclick="setRate(0.5)">0.5x</button>
        <button class="secondary" onclick="setRate(0.75)">0.75x</button>
        <button class="secondary active" onclick="setRate(1)">1x</button>
        <button class="secondary" onclick="setRate(1.25)">1.25x</button>
      </div>
      <div class="panel-row">
        <button class="secondary" onclick="setRate(1.5)">1.5x</button>
        <button class="secondary" onclick="setRate(1.75)">1.75x</button>
        <button class="secondary" onclick="setRate(2)">2x</button>
        <button class="secondary" onclick="setRate(3)">3x</button>
      </div>
    </div>

    <div class="panel">
      <h3>🎨 主题切换</h3>
      <div class="panel-row">
        <button class="secondary active" onclick="setTheme('galaxy')">🌌 Galaxy (深色)</button>
        <button class="secondary" onclick="setTheme('lucide')">☀️ Lucide (浅色)</button>
      </div>
      <div style="margin-top: 12px;">
        <label>音量</label>
        <input type="range" id="volumeSlider" min="0" max="100" value="100" style="width:100%" oninput="setVolume(this.value)">
      </div>
    </div>

    <div class="panel">
      <h3>🔤 字幕 / 章节</h3>
      <div class="panel-row">
        <button class="secondary" onclick="addSubtitles()">添加测试字幕</button>
        <button class="secondary" onclick="addChapters()">添加测试章节</button>
      </div>
      <div class="panel-row">
        <button class="secondary" onclick="cycleSubtitles()">切换字幕</button>
        <button class="secondary" onclick="nextChapter()">下一章</button>
      </div>
    </div>

    <div class="panel">
      <h3>🔧 视频滤镜</h3>
      <div class="panel-row">
        <button class="secondary" onclick="toggleFlip()">↔️ 水平翻转</button>
        <button class="secondary" onclick="toggleTheater()">🎭 剧院模式</button>
      </div>
    </div>

    <div class="panel">
      <h3>⌨️ 快捷键</h3>
      <div style="font-size: 12px; color: #aaa; line-height: 1.8;">
        <div><code style="background:#0f3460;padding:2px 6px;border-radius:3px;">Space</code> 播放/暂停</div>
        <div><code style="background:#0f3460;padding:2px 6px;border-radius:3px;">←/→</code> 快退/快进 5s</div>
        <div><code style="background:#0f3460;padding:2px 6px;border-radius:3px;">↑/↓</code> 音量 +/-</div>
        <div><code style="background:#0f3460;padding:2px 6px;border-radius:3px;">M</code> 静音</div>
        <div><code style="background:#0f3460;padding:2px 6px;border-radius:3px;">F</code> 全屏</div>
        <div><code style="background:#0f3460;padding:2px 6px;border-radius:3px;">&lt; / &gt;</code> 减速/加速</div>
      </div>
    </div>
  </div>

  <div class="log-panel">
    <h3>📋 调试日志</h3>
    <div id="logContent"></div>
  </div>

  <script type="module">
    import { PeerTubePlayer } from './peertube-player.js';

    const noopPluginsManager = {
      runHook: (hookName, resultArg, params) => Promise.resolve(resultArg)
    };

    let playerInstance = null;
    let vjsPlayer = null;
    let currentTheme = 'galaxy';
    let isFlipped = false;
    let subtitlesAdded = false;
    let chaptersAdded = false;

    function log(msg, type = 'info') {
      const panel = document.getElementById('logContent');
      const time = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = `log-entry log-${type}`;
      entry.textContent = `[${time}] ${msg}`;
      panel.appendChild(entry);
      panel.scrollTop = panel.scrollHeight;
    }

    function formatTime(seconds) {
      if (!seconds || isNaN(seconds)) return '00:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function updateStatus() {
      if (!vjsPlayer) return;
      const v = vjsPlayer.el().querySelector('video');
      document.getElementById('currentTime').textContent = formatTime(vjsPlayer.currentTime());
      document.getElementById('duration').textContent = formatTime(vjsPlayer.duration());
      document.getElementById('playbackRate').textContent = vjsPlayer.playbackRate() + 'x';
      document.getElementById('volume').textContent = Math.round(vjsPlayer.volume() * 100) + '%';
      
      const buffered = vjsPlayer.buffered();
      if (buffered.length > 0) {
        document.getElementById('buffered').textContent = buffered.end(buffered.length - 1).toFixed(1) + 's';
      }

      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      if (vjsPlayer.paused()) {
        statusDot.className = 'status-dot paused';
        statusText.textContent = '已暂停';
      } else {
        statusDot.className = 'status-dot playing';
        statusText.textContent = '播放中';
      }
    }

    window.loadVideo = async function() {
      const url = document.getElementById('m3u8Url').value.trim();
      if (!url) {
        log('请输入 M3U8 地址', 'error');
        return;
      }

      log(`正在加载视频: ${url}`, 'info');

      try {
        if (!playerInstance) {
          log('初始化 PeerTubePlayer...', 'info');

          playerInstance = new PeerTubePlayer({
            playerElement: () => document.getElementById('my-video'),
            controls: true,
            controlBar: true,
            muted: false,
            loop: false,
            peertubeLink: () => true,
            enableHotkeys: true,
            inactivityTimeout: 2000,
            videoViewIntervalMs: 30000,
            instanceName: 'PeerTube Test',
            theaterButton: true,
            authorizationHeader: () => '',
            metricsUrl: '',
            metricsInterval: 5000,
            serverUrl: window.location.origin,
            errorNotifier: (msg) => log(`错误通知: ${msg}`, 'error'),
            language: 'zh-Hans-CN',
            pluginsManager: noopPluginsManager,
            stunServers: [
              'stun:stun.l.google.com:19302',
              'stun:stun1.l.google.com:19302'
            ]
          });

          log('PeerTubePlayer 实例创建成功', 'success');
        }

        await playerInstance.load({
          mode: 'p2p-media-loader',
          theme: currentTheme,
          autoplay: false,
          forceAutoplay: false,
          p2pEnabled: true,
          isLive: false,
          thumbnails: [],
          videoViewUrl: '',
          embedUrl: '',
          embedTitle: 'PeerTube Test Video',
          videoUUID: 'test-video-uuid-12345',
          videoShortUUID: 'test123',
          duration: 0,
          videoRatio: 1.777,
          requiresUserAuth: false,
          videoFileToken: () => '',
          requiresPassword: false,
          videoPassword: () => '',
          nextVideo: {
            enabled: false,
            getVideoTitle: () => '下一个视频',
            displayControlBarButton: false
          },
          previousVideo: {
            enabled: false,
            displayControlBarButton: false
          },
          videoCaptions: [],
          videoChapters: [],
          storyboard: null,
          hls: {
            playlistUrl: url,
            segmentsSha256Url: '',
            trackerAnnounce: [],
            redundancyBaseUrls: [],
            videoFiles: []
          }
        });

        vjsPlayer = playerInstance.getPlayer();
        log('播放器加载成功！', 'success');

        vjsPlayer.on('loadstart', () => {
          log('事件: loadstart - 开始加载', 'info');
          updateStatus();
        });
        vjsPlayer.on('loadedmetadata', () => {
          log(`事件: loadedmetadata - 时长: ${vjsPlayer.duration().toFixed(1)}秒`, 'success');
          updateStatus();
        });
        vjsPlayer.on('canplay', () => {
          log('事件: canplay - 可以播放', 'success');
          updateStatus();
        });
        vjsPlayer.on('play', () => {
          log('事件: play - 开始播放', 'success');
          updateStatus();
        });
        vjsPlayer.on('pause', () => {
          log('事件: pause - 暂停', 'info');
          updateStatus();
        });
        vjsPlayer.on('ended', () => {
          log('事件: ended - 播放结束', 'info');
          updateStatus();
        });
        vjsPlayer.on('error', () => {
          const err = vjsPlayer.error();
          log(`事件: error - 代码: ${err?.code}, 消息: ${err?.message || JSON.stringify(err)}`, 'error');
        });
        vjsPlayer.on('waiting', () => log('事件: waiting - 缓冲中...', 'warn'));
        vjsPlayer.on('playing', () => {
          log('事件: playing - 播放中', 'success');
          updateStatus();
        });
        vjsPlayer.on('ratechange', () => {
          log(`事件: ratechange - 速度: ${vjsPlayer.playbackRate()}x`, 'info');
          updateStatus();
        });
        vjsPlayer.on('volumechange', () => updateStatus());
        vjsPlayer.on('timeupdate', () => updateStatus());
        vjsPlayer.on('progress', () => updateStatus());

        vjsPlayer.on('network-info', (e, data) => {
          if (data?.source === 'p2p-media-loader') {
            document.getElementById('p2pStatus').textContent = 
              data.bandwidthEstimate ? Math.round(data.bandwidthEstimate / 1000) + ' kbps' : '--';
          }
        });

        log('事件监听器已注册', 'info');
        subtitlesAdded = false;
        chaptersAdded = false;

      } catch (err) {
        log(`加载失败: ${err.message}`, 'error');
        console.error(err);
      }
    };

    window.togglePlay = () => {
      if (!vjsPlayer) { log('请先加载视频', 'warn'); return; }
      if (vjsPlayer.paused()) vjsPlayer.play();
      else vjsPlayer.pause();
    };

    window.seekBy = (seconds) => {
      if (!vjsPlayer) { log('请先加载视频', 'warn'); return; }
      vjsPlayer.currentTime(vjsPlayer.currentTime() + seconds);
      log(`跳转 ${seconds > 0 ? '+' : ''}${seconds}s`, 'info');
    };

    window.seekTo = (seconds) => {
      if (!vjsPlayer) { log('请先加载视频', 'warn'); return; }
      vjsPlayer.currentTime(seconds);
      log(`跳转到 ${seconds}s`, 'info');
    };

    window.setRate = (rate) => {
      if (!vjsPlayer) { log('请先加载视频', 'warn'); return; }
      vjsPlayer.playbackRate(rate);
      document.querySelectorAll('.panel button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    };

    window.setVolume = (val) => {
      if (!vjsPlayer) return;
      vjsPlayer.volume(val / 100);
      if (val > 0 && vjsPlayer.muted()) vjsPlayer.muted(false);
    };

    window.muteToggle = () => {
      if (!vjsPlayer) { log('请先加载视频', 'warn'); return; }
      vjsPlayer.muted(!vjsPlayer.muted());
      log(vjsPlayer.muted() ? '已静音' : '取消静音', 'info');
    };

    window.toggleFullscreen = () => {
      if (!vjsPlayer) { log('请先加载视频', 'warn'); return; }
      if (vjsPlayer.isFullscreen()) vjsPlayer.exitFullscreen();
      else vjsPlayer.requestFullscreen();
    };

    window.togglePiP = async () => {
      if (!vjsPlayer) { log('请先加载视频', 'warn'); return; }
      const v = vjsPlayer.el().querySelector('video');
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
          log('已退出画中画', 'info');
        } else {
          await v.requestPictureInPicture();
          log('已进入画中画', 'success');
        }
      } catch (e) {
        log(`画中画失败: ${e.message}`, 'error');
      }
    };

    window.toggleLoop = () => {
      if (!vjsPlayer) { log('请先加载视频', 'warn'); return; }
      vjsPlayer.loop(!vjsPlayer.loop());
      log(`循环: ${vjsPlayer.loop() ? '开启' : '关闭'}`, 'info');
    };

    window.showStats = () => {
      if (!vjsPlayer) { log('请先加载视频', 'warn'); return; }
      if (vjsPlayer.stats) {
        vjsPlayer.stats().show();
        log('已打开统计面板', 'info');
      } else {
        log('统计插件不可用', 'warn');
      }
    };

    window.setTheme = (theme) => {
      if (!vjsPlayer) { currentTheme = theme; return; }
      currentTheme = theme;
      vjsPlayer.removeClass('vjs-peertube-theme-galaxy');
      vjsPlayer.removeClass('vjs-peertube-theme-lucide');
      vjsPlayer.addClass('vjs-peertube-theme-' + theme);
      log(`切换主题: ${theme}`, 'info');
      document.querySelectorAll('.panel button').forEach(b => {
        if (b.textContent.includes(theme === 'galaxy' ? 'Galaxy' : 'Lucide')) {
          b.classList.add('active');
        } else {
          b.classList.remove('active');
        }
      });
    };

    window.toggleFlip = () => {
      if (!vjsPlayer) { log('请先加载视频', 'warn'); return; }
      isFlipped = !isFlipped;
      const v = vjsPlayer.el().querySelector('video');
      v.style.transform = isFlipped ? 'scaleX(-1)' : 'none';
      log(`水平翻转: ${isFlipped ? '开启' : '关闭'}`, 'info');
    };

    window.toggleTheater = () => {
      if (!vjsPlayer) { log('请先加载视频', 'warn'); return; }
      const container = document.querySelector('.player-container');
      if (container.style.width === '100vw') {
        container.style.width = '';
        container.style.margin = '';
        container.style.borderRadius = '';
        log('已退出剧院模式', 'info');
      } else {
        container.style.width = '100vw';
        container.style.marginLeft = 'calc(-50vw + 50%)';
        container.style.borderRadius = '0';
        log('已进入剧院模式', 'success');
      }
    };

    window.addSubtitles = () => {
      if (!vjsPlayer) { log('请先加载视频', 'warn'); return; }
      if (subtitlesAdded) { log('字幕已添加', 'warn'); return; }
      
      vjsPlayer.addRemoteTextTrack({
        kind: 'subtitles',
        srclang: 'zh',
        label: '中文',
        src: 'data:text/vtt;base64,V0VCVlRUCgowMDowMDowMS4wMDAgLS0+IDAwOjAwOjA1LjAwMAp0ZXN0IHN1YnRpdGxlIDEgLSDkuK3mlocgxCgKMDA6MDA6MDYuMDAwIC0tPiAwMDowMDoxMC4wMDAKdGVzdCBzdWJ0aXRsZSAyIC0g5Lit5paHIDI='
      }, false);
      
      vjsPlayer.addRemoteTextTrack({
        kind: 'subtitles',
        srclang: 'en',
        label: 'English',
        src: 'data:text/vtt;base64,V0VCVlRUCgowMDowMDowMS4wMDAgLS0+IDAwOjAwOjA1LjAwMApFbmdsaXNoIHN1YnRpdGxlIDEKCjAwOjAwOjA2LjAwMCAtLT4gMDA6MDA6MTAuMDAwCkVuZ2xpc2ggc3VidGl0bGUgMg=='
      }, false);
      
      subtitlesAdded = true;
      log('已添加测试字幕 (中文/English)', 'success');
    };

    window.cycleSubtitles = () => {
      if (!vjsPlayer) { log('请先加载视频', 'warn'); return; }
      const tracks = vjsPlayer.textTracks();
      let found = false;
      let nextIndex = -1;
      
      for (let i = 0; i < tracks.length; i++) {
        if (tracks[i].mode === 'showing') {
          tracks[i].mode = 'disabled';
          nextIndex = (i + 1) % (tracks.length + 1);
          found = true;
          break;
        }
      }
      
      if (!found) nextIndex = 0;
      
      if (nextIndex < tracks.length && tracks[nextIndex]) {
        tracks[nextIndex].mode = 'showing';
        log(`字幕: ${tracks[nextIndex].label}`, 'info');
      } else {
        log('字幕: 关闭', 'info');
      }
    };

    window.addChapters = () => {
      if (!vjsPlayer) { log('请先加载视频', 'warn'); return; }
      if (chaptersAdded) { log('章节已添加', 'warn'); return; }
      
      const duration = vjsPlayer.duration() || 200;
      const chapters = [
        { title: '开场介绍', time: 0 },
        { title: '第一部分', time: Math.floor(duration * 0.2) },
        { title: '第二部分', time: Math.floor(duration * 0.4) },
        { title: '精彩内容', time: Math.floor(duration * 0.6) },
        { title: '结局', time: Math.floor(duration * 0.8) }
      ];
      
      if (vjsPlayer.chapters) {
        vjsPlayer.chapters({ chapters });
        chaptersAdded = true;
        log(`已添加 ${chapters.length} 个章节`, 'success');
      } else {
        log('章节插件不可用', 'warn');
      }
    };

    window.nextChapter = () => {
      if (!vjsPlayer || !chaptersAdded) { log('请先添加章节', 'warn'); return; }
      const current = vjsPlayer.currentTime();
      const duration = vjsPlayer.duration();
      const chapterTimes = [0, Math.floor(duration * 0.2), Math.floor(duration * 0.4), Math.floor(duration * 0.6), Math.floor(duration * 0.8)];
      
      for (const t of chapterTimes) {
        if (t > current + 1) {
          vjsPlayer.currentTime(t);
          log(`跳转到下一章 (${formatTime(t)})`, 'info');
          return;
        }
      }
      log('已是最后一章', 'warn');
    };

    window.addEventListener('load', () => {
      log('页面已加载，准备测试...', 'info');
      setTimeout(() => loadVideo(), 500);
    });
  </script>
</body>
</html>
